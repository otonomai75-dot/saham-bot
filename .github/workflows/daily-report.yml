name: Daily Stock Report

on:
  # Jadwal otomatis: jam 00:00 UTC = 07:00 WIB setiap hari
  # Cron format: minute hour day month day-of-week
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger dari tab Actions di GitHub UI (tombol "Run workflow")
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # safety: kill kalau >10 menit (normalnya ~2 menit)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: saham-bot/requirements.txt

      - name: Install dependencies
        working-directory: saham-bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run saham-bot (RUN_ONCE mode)
        working-directory: saham-bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_ONCE: 'true'
          SEND_ON_START: 'false'
        run: python bot.py
